name: Daily forecast issuance

# Issues the immutable HYD/VGA D-2 and BLR/PNQ D-3 forecast every night and
# commits it to backend/issued_forecasts/, which the backend loads at startup.
# Replaces the Windows scheduled task, so no PC has to be on at night.
on:
  schedule:
    # 22:05 IST, with retries at 22:50, 23:35 and 01:35 IST. A retry is a
    # no-op once a run has committed the day's file. GitHub can start
    # scheduled runs hours late; a run before noon IST issues for the
    # previous evening (see LATE_ISSUANCE_UNTIL_HOUR in backend/main.py).
    - cron: "35 16 * * *"
    - cron: "20 17 * * *"
    - cron: "5 18 * * *"
    - cron: "5 20 * * *"
  # Use "Run workflow", not "Re-run" on an old run: a re-run uses the code
  # of the commit that run started on.
  workflow_dispatch:
    inputs:
      allow_early:
        description: "Issue today's forecast before the 22:05 cutoff"
        type: boolean
        default: false

concurrency:
  group: daily-issuance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  issue:
    runs-on: ubuntu-latest
    # Query 3085 takes 10-17 minutes, or longer when the replica is busy,
    # and runs once per target date (D-2 and D-3).
    timeout-minutes: 150
    env:
      REDASH_BASE_URL: https://analytics.sidsfarm.in
      REDASH_JOB_POLL_INTERVAL_SECONDS: "5"
      REDASH_JOB_POLL_ATTEMPTS: "720"
      QUERY_API_KEY: ${{ secrets.QUERY_API_KEY }}
      SUBSCRIPTION_QUERY_ID: "3085"
      KNOWN_BUY_ONCE_QUERY_ID: "3086"
      RECENT_ACTUALS_QUERY_ID: "3101"
      SELECTED_ACTUALS_QUERY_ID: "3114"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate festival calendars
        run: python scripts/audit_festival_calendar.py --as-of "$(date +%F)" --lookahead-days 45

      - name: Issue today's forecast
        run: python scripts/issue_daily_forecasts.py --export-ledger ${{ inputs.allow_early && '--allow-early' || '' }}

      - name: Commit the issued forecast
        id: commit
        run: |
          git add backend/issued_forecasts
          if git diff --cached --quiet; then
            echo "Nothing new to commit (already issued)."
            exit 0
          fi
          # Named after the ledger file: a late run issues the previous day.
          issued=$(basename "$(git diff --cached --name-only | head -1)" .json)
          git config user.name "forecast-issuance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Issue forecast for ${issued}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "issued=${issued}" >> "$GITHUB_OUTPUT"

      # Once per night: only after a run that issued something new.
      - name: Check recent accuracy
        if: steps.commit.outputs.issued != ''
        continue-on-error: true
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: python scripts/check_forecast_accuracy.py

      # Keeps the Trends view and the models' history at most a day behind
      # (it was weekly). Runs after the issued forecast is safely pushed.
      - name: Refresh the sales history
        if: steps.commit.outputs.issued != ''
        continue-on-error: true
        run: |
          python scripts/refresh_training_data.py
          git add data/raw/redash_exports/procurement_final_total_training.csv             data/processed/training_clean.csv data/processed/training_filled.csv             data/processed/training_features.csv             backend/ml_models/training_clean.csv backend/ml_models/training_filled.csv             backend/ml_models/training_features.csv
          if git diff --cached --quiet; then
            echo "Sales history already up to date."
            exit 0
          fi
          git commit -m "Daily refresh of sales history ($(date +%F))"
          git pull --rebase origin main
          git push origin HEAD:main

      # Renamed products and days missing from the sales data both read as
      # 0 sales; catch them within a day or two instead of weeks.
      - name: Check the sales data
        if: steps.commit.outputs.issued != ''
        continue-on-error: true
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: python scripts/check_data_quality.py

      - name: Tell the team the issuance failed
        if: failure()
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$GOOGLE_CHAT_WEBHOOK_URL" ]; then exit 0; fi
          curl -sS -X POST -H "Content-Type: application/json; charset=UTF-8" \
            -d "{\"text\": \"Order forecast issuance failed. A later retry may still succeed. Log: ${RUN_URL}\"}" \
            "$GOOGLE_CHAT_WEBHOOK_URL"
