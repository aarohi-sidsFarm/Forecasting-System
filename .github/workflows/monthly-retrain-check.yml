name: Monthly retrain check

# Trains challenger direct models without the last 28 days and backtests them
# against the live models on those days (scripts/retrain_check.py). Reports
# only; promoting a model stays a manual step. 15th of each month, 11:00 IST,
# clear of the 22:05 issuance and the Sunday maintenance.
on:
  schedule:
    - cron: "30 5 15 * *"
  workflow_dispatch:

concurrency:
  group: daily-issuance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Train challengers and compare with the live models
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: python scripts/retrain_check.py --work-dir "$RUNNER_TEMP/retrain_check"

      - name: Keep the backtests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-check
          path: ${{ runner.temp }}/retrain_check/bt_*
          retention-days: 30
