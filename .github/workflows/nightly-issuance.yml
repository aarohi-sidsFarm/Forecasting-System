name: Nightly forecast issuance

on:
  schedule:
    # 12:35 UTC = 18:05 IST, five minutes after the D-2/D-3 cutoff.
    - cron: "35 12 * * *"
  workflow_dispatch: {}

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend daily pipeline
        run: |
          set -euo pipefail
          status=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
            "${{ vars.BACKEND_URL }}/api/admin/run_daily_pipeline")
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" -ge 400 ]; then
            echo "Daily pipeline run failed"
            exit 1
          fi
